# Правила кода кассы.
#
# Всё, что не названо здесь, — по умолчанию detekt. Пороги — правила
# владельца: метод короче 25 строк, файл и класс короче 200 строк,
# параметров не больше семи; `@Suppress` запрещён.
# Прежние нарушения записаны в baseline-<модуль>.xml и снимаются при
# переводе своей области; новый код обязан укладываться в правила сразу.

build:
  maxIssues: 0
  excludeCorrectable: false

superkassa:
  active: true
  LongFile:
    active: true
    threshold: 200
  NoSuppress:
    active: true

complexity:
  active: true
  LongMethod:
    active: true
    threshold: 25
  LargeClass:
    active: true
    threshold: 200
  LongParameterList:
    active: true
    functionThreshold: 8
    constructorThreshold: 8
  TooManyFunctions:
    active: true
    # Проверки меряют одним предметом много сторон, и detekt их не считает.
    # Оснастка проверок (`testing`) — тот же код проверок, хоть и собирается
    # основным набором: сцена отрисовки уходит туда из проверок экранов.
    excludes: ['**/test/**', '**/*Test/**', '**/testing/src/**']

style:
  active: true
  MagicNumber:
    active: true
    # Числа проверок — их данные, а не правила кода. Оснастка проверок
    # (`testing`) — тот же код проверок, хоть и собирается основным набором.
    excludes: ['**/test/**', '**/*Test/**', '**/testing/src/**']
  # Функция превью закрыта: её зовёт только Android Studio и проверка
  # превью — по общей аннотации дизайн-системы, а не по имени.
  UnusedPrivateMember:
    active: true
    ignoreAnnotated: ['ScreenPreviews', 'PanePreviews', 'ElementPreviews']
  WildcardImport:
    active: true
    excludeImports: ['kotlin.test.*']
  UnusedImports:
    active: true

naming:
  active: true
  FunctionNaming:
    active: true
    functionPattern: '^[a-z][a-zA-Z0-9]*$'
    # Проверка называется фразой в обратных кавычках — в любом тестовом
    # наборе: `test`, `commonTest`, `jvmTest`, `androidHostTest`, `iosTest`.
    excludes: ['**/test/**', '**/*Test/**']
    ignoreAnnotated: ['Composable']
  PackageNaming:
    active: true
    packagePattern: '^[a-z_]+(\.[a-z_][a-z0-9_]*)*$'

formatting:
  active: true
  autoCorrect: true
