# Память сборки задаётся здесь, а не достаётся от машины.
#
# Полная сборка модуля кассы — весь Compose сразу — не укладывается
# в значения Gradle по умолчанию: чистый клон падал с OutOfMemoryError
# в `:compileKotlin`. На рабочей машине этого не видно, там сборка идёт
# по частям и компилируется десяток изменённых файлов.
org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g
kotlin.daemon.jvmargs=-Xmx4g

# Разбор кода Compose быстрее с параллельной сборкой и кэшем.
org.gradle.caching=true
