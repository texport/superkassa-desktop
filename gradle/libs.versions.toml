[versions]
# Версия кассы, когда метки выпуска нет: `-PappVersion` её заменяет.
# Номер сборки Android растёт с каждым выпуском в магазин.
appVersion = "1.0.0"
appVersionCode = "1"
kotlin = "2.4.10"
compose = "1.12.0"
# Material 3 и значки Compose Multiplatform выпускаются своей линией, не версией
# плагина: значки закреплены на 1.7.3 и новых выпусков не получают.
composeMaterial3 = "1.9.0"
composeMaterialIcons = "1.7.3"
# Адаптивная раскладка Material 3 («список и подробности»): своя линия выпусков.
composeAdaptive = "1.2.0"
ktor = "3.5.2"
serialization = "1.11.0"
coroutines = "1.11.0"
detekt = "1.23.8"
jna = "5.19.0"
# Криптопровайдер Kalkan НУЦ РК: в Maven Central его нет, НУЦ выдаёт его
# разработчикам по запросу — берётся из локального хранилища Maven.
kalkan = "0.7.5"
agp = "9.4.1"
androidCompileSdk = "37"
androidMinSdk = "23"
androidTargetSdk = "37"
activity-compose = "1.13.0"
lifecycle = "2.11.0"
# Навигация экранов — Navigation 3: история «назад» — список ключей экранов,
# рисует её `NavDisplay`. Ключи и история — в библиотеке Google, отрисовка —
# в сборке JetBrains для всех целей Compose Multiplatform.
navigation3 = "1.1.2"
navigation3Runtime = "1.1.7"
kotlinx-datetime = "0.8.0"
kotlinx-io = "0.9.1"
# Блокировки общего кода: та же версия, что приходит с корутинами на iOS.
kotlinx-atomicfu = "0.32.1"
androidx-lifecycle = "2.11.0"
core-splashscreen = "1.2.0"
work = "2.11.2"
superkassa-core = "1.5.0-SNAPSHOT"
# Аннотации проверки, которыми ядро помечает свои типы. Ядро отдаёт их только
# во время исполнения, а компилятор проверок на JVM видит их в выведенных
# типах и требует класс аннотации; версия — та же, что у ядра.
jakarta-validation = "3.1.1"

[libraries]
superkassa-core-embedded = { group = "io.github.texport", name = "superkassa-core-embedded", version.ref = "superkassa-core" }
superkassa-core-presentation = { group = "io.github.texport", name = "superkassa-core-presentation", version.ref = "superkassa-core" }
superkassa-core-domain = { group = "io.github.texport", name = "superkassa-core-domain", version.ref = "superkassa-core" }
superkassa-core-import-node = { group = "io.github.texport", name = "superkassa-core-import-node", version.ref = "superkassa-core" }
jakarta-validation-api = { group = "jakarta.validation", name = "jakarta.validation-api", version.ref = "jakarta-validation" }
superkassa-core-testing = { group = "io.github.texport", name = "superkassa-core-testing", version.ref = "superkassa-core" }
compose-runtime = { group = "org.jetbrains.compose.runtime", name = "runtime", version.ref = "compose" }
compose-foundation = { group = "org.jetbrains.compose.foundation", name = "foundation", version.ref = "compose" }
compose-ui = { group = "org.jetbrains.compose.ui", name = "ui", version.ref = "compose" }
compose-material3 = { group = "org.jetbrains.compose.material3", name = "material3", version.ref = "composeMaterial3" }
compose-material-icons-extended = { group = "org.jetbrains.compose.material", name = "material-icons-extended", version.ref = "composeMaterialIcons" }
# Превью в общем коде: аннотация `@Preview` для Android Studio на всех целях
# и отрисовщик превью — только в Android-сборке модуля, не в приложении.
compose-ui-tooling-preview = { group = "org.jetbrains.compose.ui", name = "ui-tooling-preview", version.ref = "compose" }
compose-ui-tooling = { group = "org.jetbrains.compose.ui", name = "ui-tooling", version.ref = "compose" }
compose-adaptive = { group = "org.jetbrains.compose.material3.adaptive", name = "adaptive", version.ref = "composeAdaptive" }
compose-adaptive-layout = { group = "org.jetbrains.compose.material3.adaptive", name = "adaptive-layout", version.ref = "composeAdaptive" }
compose-adaptive-navigation = { group = "org.jetbrains.compose.material3.adaptive", name = "adaptive-navigation", version.ref = "composeAdaptive" }
compose-adaptive-navigation-suite = { group = "org.jetbrains.compose.material3", name = "material3-adaptive-navigation-suite", version.ref = "composeMaterial3" }
compose-desktop = { group = "org.jetbrains.compose.desktop", name = "desktop", version.ref = "compose" }
lifecycle-viewmodel-compose = { group = "org.jetbrains.androidx.lifecycle", name = "lifecycle-viewmodel-compose", version.ref = "lifecycle" }
lifecycle-runtime-compose = { group = "org.jetbrains.androidx.lifecycle", name = "lifecycle-runtime-compose", version.ref = "lifecycle" }
navigation3-ui = { group = "org.jetbrains.androidx.navigation3", name = "navigation3-ui", version.ref = "navigation3" }
navigation3-runtime = { group = "androidx.navigation3", name = "navigation3-runtime", version.ref = "navigation3Runtime" }
kotlinx-datetime = { group = "org.jetbrains.kotlinx", name = "kotlinx-datetime", version.ref = "kotlinx-datetime" }
kotlinx-io-core = { group = "org.jetbrains.kotlinx", name = "kotlinx-io-core", version.ref = "kotlinx-io" }
kotlinx-atomicfu = { group = "org.jetbrains.kotlinx", name = "atomicfu", version.ref = "kotlinx-atomicfu" }
kotlinx-coroutines-core = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-core", version.ref = "coroutines" }
kotlinx-coroutines-test = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-test", version.ref = "coroutines" }
ktor-client-core = { group = "io.ktor", name = "ktor-client-core", version.ref = "ktor" }
ktor-client-cio = { group = "io.ktor", name = "ktor-client-cio", version.ref = "ktor" }
ktor-client-java = { group = "io.ktor", name = "ktor-client-java", version.ref = "ktor" }
ktor-client-okhttp = { group = "io.ktor", name = "ktor-client-okhttp", version.ref = "ktor" }
ktor-client-darwin = { group = "io.ktor", name = "ktor-client-darwin", version.ref = "ktor" }
ktor-client-content-negotiation = { group = "io.ktor", name = "ktor-client-content-negotiation", version.ref = "ktor" }
ktor-client-websockets = { group = "io.ktor", name = "ktor-client-websockets", version.ref = "ktor" }
ktor-serialization-json = { group = "io.ktor", name = "ktor-serialization-kotlinx-json", version.ref = "ktor" }
kotlinx-serialization-json = { group = "org.jetbrains.kotlinx", name = "kotlinx-serialization-json", version.ref = "serialization" }
kotlinx-coroutines-swing = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-swing", version.ref = "coroutines" }
jna = { group = "net.java.dev.jna", name = "jna", version.ref = "jna" }
kalkan-provider = { group = "kz.gov.pki.kalkan", name = "knca_provider_jce_kalkan", version.ref = "kalkan" }
kotlin-test = { group = "org.jetbrains.kotlin", name = "kotlin-test", version.ref = "kotlin" }
kotlin-test-junit5 = { group = "org.jetbrains.kotlin", name = "kotlin-test-junit5", version.ref = "kotlin" }
ktor-client-mock = { group = "io.ktor", name = "ktor-client-mock", version.ref = "ktor" }
detekt-api = { group = "io.gitlab.arturbosch.detekt", name = "detekt-api", version.ref = "detekt" }
androidx-activity = { group = "androidx.activity", name = "activity", version.ref = "activity-compose" }
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activity-compose" }
androidx-core-splashscreen = { group = "androidx.core", name = "core-splashscreen", version.ref = "core-splashscreen" }
androidx-work-runtime = { group = "androidx.work", name = "work-runtime", version.ref = "work" }
androidx-lifecycle-process = { group = "androidx.lifecycle", name = "lifecycle-process", version.ref = "androidx-lifecycle" }
kotlin-gradle-plugin = { group = "org.jetbrains.kotlin", name = "kotlin-gradle-plugin", version.ref = "kotlin" }
android-gradle-plugin = { group = "com.android.tools.build", name = "gradle", version.ref = "agp" }
detekt-formatting = { group = "io.gitlab.arturbosch.detekt", name = "detekt-formatting", version.ref = "detekt" }

[plugins]
kotlin-multiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }
android-application = { id = "com.android.application", version.ref = "agp" }
android-kotlin-multiplatform-library = { id = "com.android.kotlin.multiplatform.library", version.ref = "agp" }
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
compose = { id = "org.jetbrains.compose", version.ref = "compose" }
compose-compiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
detekt = { id = "io.gitlab.arturbosch.detekt", version.ref = "detekt" }
