# Проверка каждого изменения. Её же вызывают установщики (installers.yml):
# установщик собирается только из того, что прошло эту проверку. Пуш в main
# проверяют они же — отдельный запуск здесь повторил бы ту же работу.
#
# Проверка разбита на задачи, которые идут одновременно: Android и detekt —
# на Linux, JVM и iOS — на macOS. Одной задачей на macOS всё шло друг за
# другом больше получаса; теперь выпуск ждёт самую долгую из них. Проверки
# JVM рисуют экраны Compose и остаются на macOS: на Linux другие шрифты
# рвали строки плашек, а Skia без экрана роняла виртуальную машину.
#
# Ядро с кодеком и протоколом сборка берёт готовыми из выпуска ядра на
# GitHub (settings.gradle.kts): из исходников соседи не собираются.
name: CI Build

on:
  push:
    branches-ignore: [ main ]
  pull_request:
    branches: [ main ]
  workflow_call:

permissions:
  contents: read

jobs:
  # На Linux цели iOS выключены сами (kotlin.native.ignoreDisabledTargets):
  # `check` без JVM проверяет Android и detekt.
  android:
    name: Android
    runs-on: ubuntu-latest
    # Kalkan НУЦ РК публиковать нельзя: он лежит в приватном репозитории
    # texport/kalkan, и сборка берёт его токеном только на чтение.
    env:
      KALKAN_REPO_TOKEN: ${{ secrets.KALKAN_REPO_TOKEN }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: 'temurin'

      # Кэш v6 — закрытый компонент gradle-actions-caching: пользуясь им,
      # репозиторий принимает https://gradle.com/legal/terms-of-use/.
      # Условия приняты; отказ от них — cache-provider: basic.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: enhanced

      # Kalkan кладётся туда же, где он лежит на машине разработчика, —
      # в локальный Maven: сборка берёт его оттуда первым.
      - name: Kalkan
        if: env.KALKAN_REPO_TOKEN != ''
        uses: actions/checkout@v7
        with:
          repository: texport/kalkan
          token: ${{ secrets.KALKAN_REPO_TOKEN }}
          path: .kalkan

      - name: Kalkan в локальный Maven
        if: env.KALKAN_REPO_TOKEN != ''
        run: |
          mkdir -p ~/.m2/repository
          cp -R .kalkan/kz ~/.m2/repository/
          rm -rf .kalkan

      # Предупреждение компилятора роняет сборку. Android без Kalkan не
      # компилируется: подпись файлом ключа стоит на нём. Пока токена
      # к Kalkan в секретах нет, здесь идёт только detekt, а о пропуске
      # Android сказано в сводке запуска.
      - name: Android и detekt
        run: |
          if [ -n "$KALKAN_REPO_TOKEN" ]; then
            ./gradlew check -x jvmTest :androidApp:assembleDebug
          else
            echo "::warning::Нет секрета KALKAN_REPO_TOKEN — Android не проверен: без Kalkan он не компилируется"
            ./gradlew detekt
          fi

  # Общий код и JVM: модели, сценарии и экраны, нарисованные Compose.
  jvm:
    name: JVM
    runs-on: macos-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: enhanced

      - name: JVM
        run: ./gradlew jvmTest :detekt-rules:test

  # Цели iOS компилируются и проверяются только на macOS.
  ios:
    name: iOS
    runs-on: macos-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: enhanced

      - name: iOS
        run: ./gradlew iosSimulatorArm64Test

  # Снимки экранов и раскладка по размерам окна — своей задачей: в `check`
  # перед каждым коммитом их нет, здесь они идут на каждой ветке. Выпуск
  # их не ждёт: кадры — для приёмки вёрстки, а на машине GitHub они идут
  # дольше всей остальной проверки вместе взятой.
  #
  # В вызове из выпуска github.workflow — имя выпуска, а не этой проверки.
  screenshots:
    name: Screenshots
    if: github.workflow == 'CI Build'
    runs-on: macos-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: enhanced

      - name: Screenshots
        run: ./gradlew screenshots
