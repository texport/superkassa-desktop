# Проверка каждого изменения. Её же вызывают установщики (installers.yml):
# установщик собирается только из того, что прошло эту проверку. Пуш в main
# проверяют они же — отдельный запуск здесь повторил бы ту же работу.
#
# Шаги настройки (checkout, Java, Gradle, соседи) — те же, что у библиотек
# и у узла; дальше — задачи самой кассы.
#
# macOS — потому что у интеграций есть iOS-цели, а компилируются и
# проверяются они только там; Android SDK на раннере macOS уже стоит.
name: CI Build

on:
  push:
    branches-ignore: [ main ]
  pull_request:
    branches: [ main ]
  workflow_call:
    inputs:
      screenshots:
        description: Снимать ли кадры экранов
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  build:
    name: Build & Test
    runs-on: macos-latest
    # Kalkan НУЦ РК публиковать нельзя: он лежит в приватном репозитории
    # texport/kalkan, и сборка берёт его токеном только на чтение.
    env:
      KALKAN_REPO_TOKEN: ${{ secrets.KALKAN_REPO_TOKEN }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      # Касса собирается на 21 (jvmToolchain), соседи — на 17: их Gradle
      # берёт 17 сам, но с готовым JDK не тратит время на загрузку.
      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          java-version: |
            17
            21
          distribution: 'temurin'

      # Кэш v6 — закрытый компонент gradle-actions-caching: пользуясь им,
      # репозиторий принимает https://gradle.com/legal/terms-of-use/.
      # Условия приняты; отказ от них — cache-provider: basic.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: enhanced

      - name: Build Siblings from Sources
        uses: ./.github/actions/siblings

      # Kalkan кладётся туда же, где он лежит на машине разработчика, —
      # в локальный Maven: сборка берёт его оттуда первым.
      - name: Kalkan
        if: env.KALKAN_REPO_TOKEN != ''
        uses: actions/checkout@v7
        with:
          repository: texport/kalkan
          token: ${{ secrets.KALKAN_REPO_TOKEN }}
          path: .kalkan

      - name: Kalkan в локальный Maven
        if: env.KALKAN_REPO_TOKEN != ''
        run: |
          mkdir -p ~/.m2/repository
          cp -R .kalkan/kz ~/.m2/repository/
          rm -rf .kalkan

      # detekt, компиляция всех модулей и целей и все проверки — одной
      # задачей `check`; предупреждение компилятора роняет сборку.
      #
      # Android без Kalkan не компилируется: подпись файлом ключа стоит
      # на нём. Пока токена к Kalkan в секретах нет, проверяется всё, что
      # от него не зависит, — общий код, JVM и снимки экранов, — а о пропуске
      # Android сказано в сводке запуска.
      - name: Check
        run: |
          if [ -n "$KALKAN_REPO_TOKEN" ]; then
            ./gradlew check
          else
            echo "::warning::Нет секрета KALKAN_REPO_TOKEN — Android не проверен: без Kalkan он не компилируется"
            ./gradlew jvmTest detekt :detekt-rules:test
          fi

      - name: Android
        if: env.KALKAN_REPO_TOKEN != ''
        run: ./gradlew :androidApp:assembleDebug

      # Снимки экранов и раскладка по размерам окна — своей задачей:
      # в `check` перед каждым коммитом их нет, здесь они идут на каждой ветке.
      #
      # Выпуск их не ждёт: кадры — для приёмки вёрстки, а на машине GitHub
      # они идут дольше всей остальной проверки вместе взятой.
      - name: Screenshots
        if: inputs.screenshots != false
        run: ./gradlew screenshots
