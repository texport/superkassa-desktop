# Установщики кассы для трёх систем и APK для Android.
#
# jpackage и jlink кросс-сборки не умеют: установщик для Windows собирается
# на Windows, deb — на Linux, dmg — на macOS. Поэтому матрица, а не один
# запуск.
#
# Проверка (ci.yml) и сборка установщиков идут одновременно: выпуск
# публикуется, только когда зелёные обе, но собирать ради этого ждать
# проверку незачем — друг за другом выпуск шёл больше получаса.
#
# Касса работает в процессе приложения: узла в установщике нет, и собирать
# его не нужно.
#
# Выпуск делается сам: каждый пуш в main, прошедший проверку, становится
# следующей версией — номер после последней метки v*, на единицу больше.
# Метку ставит сам выпуск; метка, поставленная руками, выпускает ровно её.
name: Установщики

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    tags: [ 'v*' ]

permissions:
  contents: write

# Два пуша подряд не должны взять один и тот же номер: выпуски идут
# по очереди, и второй видит метку первого.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  # Номер выпуска. По метке v1.2.3 — 1.2.3; иначе — следующий после
  # последней метки: v1.0.6 → 1.0.7.
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.next.outputs.version }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Номер выпуска
        id: next
        shell: bash
        run: |
          case "$GITHUB_REF" in
            refs/tags/v[0-9]*) version="${GITHUB_REF_NAME#v}" ;;
            *)
              last=$(git tag --list 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | head -n 1)
              last="${last#v}"
              IFS=. read -r major minor patch <<< "${last:-0.0.0}"
              version="$major.$minor.$((patch + 1))"
              ;;
          esac
          echo "Выпуск $version"
          echo "version=$version" >> "$GITHUB_OUTPUT"

  ci:
    uses: ./.github/workflows/ci.yml
    # Проверке нужен вход в хранилище Kalkan из секретов репозитория.
    secrets: inherit
    # Кадры экранов снимает проверка веток; выпуск их не ждёт.
    with:
      screenshots: false

  installers:
    needs: version
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, windows-latest, macos-latest ]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: 'temurin'

      # Кэш v6 — закрытый компонент gradle-actions-caching: пользуясь им,
      # репозиторий принимает https://gradle.com/legal/terms-of-use/.
      # Условия приняты; отказ от них — cache-provider: basic.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: enhanced

      - name: Собрать установщик
        shell: bash
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: ./gradlew :desktopApp:packageDistributionForCurrentOS -PappVersion="$VERSION"

      - name: Выложить установщик
        uses: actions/upload-artifact@v7
        with:
          name: superkassa-${{ matrix.os }}
          path: |
            desktopApp/build/compose/binaries/main/msi/*.msi
            desktopApp/build/compose/binaries/main/deb/*.deb
            desktopApp/build/compose/binaries/main/dmg/*.dmg
          if-no-files-found: error

  # APK для Android, подписанный ключом выпусков, — докладывается в уже
  # вышедший выпуск.
  #
  # Касса на Android обновляется с GitHub, мимо магазинов: она скачивает
  # APK выпуска, сверяет сумму и отдаёт установщику системы. Android ставит
  # поверх только APK, подписанный тем же ключом, что установленный, и с
  # номером сборки не меньше прежнего: номер считается из метки, ключ —
  # из секретов репозитория. Подписанный отладочным ключом, APK не встал бы
  # поверх ни одной кассы, поэтому без ключа он не собирается вовсе.
  #
  # Выпуск для компьютеров Android не ждёт: пока нет ключа выпусков или
  # токена к Kalkan, выпуск выходит с установщиками, а здесь в сводке
  # запуска сказано, чего не хватило для APK.
  android:
    needs: [ version, release ]
    if: ${{ !cancelled() && needs.release.result == 'success' }}
    runs-on: ubuntu-latest
    env:
      KALKAN_REPO_TOKEN: ${{ secrets.KALKAN_REPO_TOKEN }}
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
    steps:
      - name: Есть ли из чего собрать APK
        id: ready
        shell: bash
        run: |
          missing=""
          [ -n "$KALKAN_REPO_TOKEN" ] || missing="$missing KALKAN_REPO_TOKEN"
          [ -n "$ANDROID_KEYSTORE_BASE64" ] || missing="$missing ANDROID_KEYSTORE_BASE64"
          if [ -n "$missing" ]; then
            echo "::warning::APK в выпуск не добавлен — нет секретов:$missing"
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout Repository
        if: steps.ready.outputs.ready == 'true'
        uses: actions/checkout@v7

      - name: Set up Java
        if: steps.ready.outputs.ready == 'true'
        uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Set up Gradle
        if: steps.ready.outputs.ready == 'true'
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: enhanced

      # Kalkan — из приватного репозитория, в локальный Maven (см. ci.yml).
      - name: Kalkan
        if: steps.ready.outputs.ready == 'true'
        uses: actions/checkout@v7
        with:
          repository: texport/kalkan
          token: ${{ secrets.KALKAN_REPO_TOKEN }}
          path: .kalkan

      - name: Kalkan в локальный Maven
        if: steps.ready.outputs.ready == 'true'
        run: |
          mkdir -p ~/.m2/repository
          cp -R .kalkan/kz ~/.m2/repository/
          rm -rf .kalkan

      # Хранилище ключа лежит в секрете base64-строкой и пишется во
      # временный каталог запуска: в репозиторий и в артефакты оно не
      # попадает. Сборка берёт его путь из ANDROID_KEYSTORE_FILE.
      - name: Ключ выпусков Android
        if: steps.ready.outputs.ready == 'true'
        shell: bash
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/superkassa-release.jks"
          echo "ANDROID_KEYSTORE_FILE=$RUNNER_TEMP/superkassa-release.jks" >> "$GITHUB_ENV"

      - name: Собрать APK
        if: steps.ready.outputs.ready == 'true'
        shell: bash
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          ./gradlew :androidApp:assembleRelease -PappVersion="$VERSION"
          mkdir -p apk
          cp androidApp/build/outputs/apk/release/androidApp-release.apk "apk/Superkassa-$VERSION.apk"

      - name: Доложить APK в выпуск
        if: steps.ready.outputs.ready == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v${{ needs.version.outputs.version }}
        run: gh release upload "$TAG" --repo "${GITHUB_REPOSITORY}" --clobber apk/*.apk

  # Выпуск с готовыми установщиками.
  #
  # Собранное иначе живёт артефактами запуска: они пропадают через
  # девяносто дней и требуют входа в GitHub. Проверяющему нужна ссылка,
  # по которой скачивается файл, — это выпуск. Он делается из main и из
  # метки; запуск руками с другой ветки только собирает.
  release:
    needs: [ version, ci, installers ]
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Забрать установщики
        uses: actions/download-artifact@v8
        with:
          pattern: superkassa-*
          path: installers

      # Выпуск мог быть заведён руками до сборки — с заметками о том,
      # что в нём поменялось. Тогда установщики докладываются в него,
      # а не создаётся второй: попытка создать существующий роняла шаг,
      # и выпуск оставался без файлов, хотя все три собрались.
      # Метку ставит сам выпуск на проверенный коммит: у пуша в main её
      # ещё нет. Метка, созданная так, нового запуска не вызывает.
      - name: Выпустить
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v${{ needs.version.outputs.version }}
        run: |
          built=$(find installers -type f \( -name '*.msi' -o -name '*.deb' -o -name '*.dmg' -o -name '*.apk' \) -print)
          echo "$built"
          if gh release view "$TAG" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            gh release upload "$TAG" --repo "${GITHUB_REPOSITORY}" --clobber $built
          else
            gh release create "$TAG" \
              --repo "${GITHUB_REPOSITORY}" \
              --target "${GITHUB_SHA}" \
              --title "Release $TAG" \
              --notes "Установщики для Windows, Linux и macOS; APK для Android докладывается следом. Касса работает сама по себе — ставить и запускать отдельно ничего не нужно." \
              $built
          fi
