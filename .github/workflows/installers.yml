# Установщики кассы для трёх систем.
#
# jpackage и jlink кросс-сборки не умеют: установщик для Windows собирается
# на Windows, deb — на Linux, dmg — на macOS. Поэтому матрица, а не один
# запуск.
#
# Узел едет внутри установщика, и собрать его надо здесь же. Ядро в Maven
# Central отстаёт от того, что нужно узлу, поэтому оно собирается из
# исходников и кладётся в локальное хранилище — публиковать ради сборки
# ничего не требуется.
name: Установщики

on:
  workflow_dispatch:
  push:
    tags: [ 'v*' ]

permissions:
  contents: write

jobs:
  installers:
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, windows-latest, macos-latest ]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Касса
        uses: actions/checkout@v4
        with:
          path: superkassa-desktop

      - name: Протокол
        uses: actions/checkout@v4
        with:
          repository: texport/ofd-kt-proto
          path: ofd-kt-proto

      - name: Кодек протокола
        uses: actions/checkout@v4
        with:
          repository: texport/ofd-proto-codec
          path: ofd-proto-codec

      - name: Ядро
        uses: actions/checkout@v4
        with:
          repository: texport/superkassa-core
          path: superkassa-core

      - name: Узел
        uses: actions/checkout@v4
        with:
          repository: texport/superkassa-server
          path: superkassa-server

      - name: Java
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'zulu'

      # Цепочка версий, которых в Maven Central нет: протокол 2.0.4 →
      # кодек → ядро. Каждое звено собирается из исходников и кладётся
      # в локальное хранилище, публиковать ничего не требуется.
      - name: Протокол в локальное хранилище
        working-directory: ofd-kt-proto
        run: ./gradlew publishToMavenLocal

      - name: Кодек в локальное хранилище
        working-directory: ofd-proto-codec
        run: ./gradlew publishToMavenLocal

      - name: Ядро в локальное хранилище
        working-directory: superkassa-core
        run: ./gradlew publishToMavenLocal

      - name: Собрать узел
        working-directory: superkassa-server
        run: ./gradlew :server:bootJar

      - name: Собрать установщик
        working-directory: superkassa-desktop
        shell: bash
        run: |
          jar=$(ls ../superkassa-server/server/build/libs/server-*.jar | grep -v plain | head -1)
          # Без узла установщик поставится и молча не заработает.
          test -s "$jar" || { echo "узел не собрался: $jar"; exit 1; }
          # По метке v1.0.2 установщик называется 1.0.2; без метки остаётся
          # значение по умолчанию из сборки.
          version="${GITHUB_REF_NAME#v}"
          case "$version" in
            [0-9]*) ;;
            *) version="" ;;
          esac
          ./gradlew packageDistributionForCurrentOS \
            -PnodeJar="$(cd "$(dirname "$jar")" && pwd)/$(basename "$jar")" \
            ${version:+-PappVersion="$version"}

      - name: Выложить установщик
        uses: actions/upload-artifact@v4
        with:
          name: superkassa-${{ matrix.os }}
          path: |
            superkassa-desktop/build/compose/binaries/main/msi/*.msi
            superkassa-desktop/build/compose/binaries/main/deb/*.deb
            superkassa-desktop/build/compose/binaries/main/dmg/*.dmg
          if-no-files-found: error

  # Выпуск с готовыми установщиками.
  #
  # Собранное иначе живёт артефактами запуска: они пропадают через
  # девяносто дней и требуют входа в GitHub. Проверяющему нужна ссылка,
  # по которой скачивается файл, — это выпуск, и делается он по метке.
  release:
    needs: installers
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Забрать установщики
        uses: actions/download-artifact@v4
        with:
          path: installers

      # Выпуск мог быть заведён руками до сборки — с заметками о том,
      # что в нём поменялось. Тогда установщики докладываются в него,
      # а не создаётся второй: попытка создать существующий роняла шаг,
      # и выпуск оставался без файлов, хотя все три собрались.
      - name: Выпустить
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          built=$(find installers -type f \( -name '*.msi' -o -name '*.deb' -o -name '*.dmg' \) -print)
          echo "$built"
          if gh release view "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            gh release upload "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" --clobber $built
          else
            gh release create "${GITHUB_REF_NAME}" \
              --repo "${GITHUB_REPOSITORY}" \
              --title "Суперкасса ${GITHUB_REF_NAME}" \
              --notes "Установщики для Windows, Linux и macOS. Узел кассы едет внутри — ставить и запускать отдельно ничего не нужно." \
              $built
          fi
