# Установщики кассы для трёх систем и APK для Android.
#
# jpackage и jlink кросс-сборки не умеют: установщик для Windows собирается
# на Windows, deb — на Linux, dmg — на macOS. Поэтому матрица, а не один
# запуск.
#
# Установщик собирается только из того, что прошло проверку (ci.yml).
#
# Касса работает в процессе приложения: узла в установщике нет, и собирать
# его не нужно.
name: Установщики

on:
  workflow_dispatch:
  push:
    tags: [ 'v*' ]

permissions:
  contents: write

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  installers:
    needs: ci
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, windows-latest, macos-latest ]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      # Касса собирается на 21, соседи — на 17; см. ci.yml.
      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          java-version: |
            17
            21
          distribution: 'temurin'

      # Кэш v6 — закрытый компонент gradle-actions-caching: пользуясь им,
      # репозиторий принимает https://gradle.com/legal/terms-of-use/.
      # Условия приняты; отказ от них — cache-provider: basic.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: enhanced

      - name: Build Siblings from Sources
        uses: ./.github/actions/siblings

      - name: Собрать установщик
        shell: bash
        run: |
          # По метке v1.0.2 установщик называется 1.0.2; без метки остаётся
          # значение по умолчанию из сборки.
          version="${GITHUB_REF_NAME#v}"
          case "$version" in
            [0-9]*) ;;
            *) version="" ;;
          esac
          ./gradlew :desktopApp:packageDistributionForCurrentOS \
            ${version:+-PappVersion="$version"}

      - name: Выложить установщик
        uses: actions/upload-artifact@v7
        with:
          name: superkassa-${{ matrix.os }}
          path: |
            desktopApp/build/compose/binaries/main/msi/*.msi
            desktopApp/build/compose/binaries/main/deb/*.deb
            desktopApp/build/compose/binaries/main/dmg/*.dmg
          if-no-files-found: error

  # APK для Android, подписанный ключом выпусков.
  #
  # Касса на Android обновляется с GitHub, мимо магазинов: она скачивает
  # APK выпуска, сверяет сумму и отдаёт установщику системы. Android ставит
  # поверх только APK, подписанный тем же ключом, что установленный, и с
  # номером сборки не меньше прежнего: номер считается из метки, ключ —
  # из секретов репозитория. Без ключа APK не собирается вовсе: подписанный
  # отладочным ключом, он не встал бы поверх ни одной кассы.
  android:
    needs: ci
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          java-version: |
            17
            21
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: enhanced

      - name: Build Siblings from Sources
        uses: ./.github/actions/siblings

      # Хранилище ключа лежит в секрете base64-строкой и пишется во
      # временный каталог запуска: в репозиторий и в артефакты оно не
      # попадает. Сборка берёт его путь из ANDROID_KEYSTORE_FILE.
      - name: Ключ выпусков Android
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "::error::Нет секрета ANDROID_KEYSTORE_BASE64 — APK выпуска подписывается только ключом выпусков"
            exit 1
          fi
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/superkassa-release.jks"
          echo "ANDROID_KEYSTORE_FILE=$RUNNER_TEMP/superkassa-release.jks" >> "$GITHUB_ENV"

      - name: Собрать APK
        shell: bash
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          case "$version" in
            [0-9]*) ;;
            *) version="" ;;
          esac
          ./gradlew :androidApp:assembleRelease ${version:+-PappVersion="$version"}
          mkdir -p apk
          cp androidApp/build/outputs/apk/release/androidApp-release.apk "apk/Superkassa-${version:-dev}.apk"

      - name: Выложить APK
        uses: actions/upload-artifact@v7
        with:
          name: superkassa-android
          path: apk/*.apk
          if-no-files-found: error

  # Выпуск с готовыми установщиками.
  #
  # Собранное иначе живёт артефактами запуска: они пропадают через
  # девяносто дней и требуют входа в GitHub. Проверяющему нужна ссылка,
  # по которой скачивается файл, — это выпуск, и делается он по метке.
  release:
    needs: [ installers, android ]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Забрать установщики
        uses: actions/download-artifact@v8
        with:
          pattern: superkassa-*
          path: installers

      # Выпуск мог быть заведён руками до сборки — с заметками о том,
      # что в нём поменялось. Тогда установщики докладываются в него,
      # а не создаётся второй: попытка создать существующий роняла шаг,
      # и выпуск оставался без файлов, хотя все три собрались.
      - name: Выпустить
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          built=$(find installers -type f \( -name '*.msi' -o -name '*.deb' -o -name '*.dmg' -o -name '*.apk' \) -print)
          echo "$built"
          if gh release view "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            gh release upload "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" --clobber $built
          else
            gh release create "${GITHUB_REF_NAME}" \
              --repo "${GITHUB_REPOSITORY}" \
              --title "Суперкасса ${GITHUB_REF_NAME}" \
              --notes "Установщики для Windows, Linux и macOS и APK для Android. Касса работает сама по себе — ставить и запускать отдельно ничего не нужно." \
              $built
          fi
